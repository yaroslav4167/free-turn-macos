name: Build macOS desktop
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Build signed app bundle
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: v0.1.0
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: sh packaging/macos/build-desktop.sh
      - name: Frontend regression checks
        run: npm --prefix desktop/frontend test
      - name: Go tests and vet
        run: |
          go test ./desktop/... ./internal/session ./mobile
          go test -race ./desktop/backend/... ./desktop/integration ./desktop/updates
          go vet ./desktop/... ./cmd/macos-vpn-helper
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeTurn-macOS-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
