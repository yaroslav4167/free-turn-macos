name: Release macOS client
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Build macOS release
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: sh packaging/macos/build-desktop.sh
      - name: Test packaged source
        run: |
          npm --prefix desktop/frontend test
          go test ./desktop/... ./internal/session ./mobile
          go test -c ./desktop/backend/wintunnel -o "$RUNNER_TEMP/wintunnel-routing.test"
          sudo -n env FREETURN_PRIVILEGED_TESTS=1 "$RUNNER_TEMP/wintunnel-routing.test" -test.run '^TestMacPrivilegedScopedRouting$' -test.v -test.timeout 45s
      - name: Validate packaged app with the updater
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export FREETURN_TEST_MACOS_ARCHIVE="$PWD/dist/FreeTurn-macOS-${MACOS_ARCH}-${RELEASE_TAG}.zip"
          export FREETURN_TEST_MACOS_VERSION="$RELEASE_TAG"
          go test ./desktop/updates -run '^TestMacPackagedArchive$' -v -count=1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Collect checksums
        run: cat dist/*.sha256 > dist/checksums.txt
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FreeTurn macOS ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES_MACOS.md
          files: |
            dist/*.zip
            dist/checksums.txt
